<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account CRM · Eastern Counties & Aldermoor</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#e4e1d8;--acc:#1f5eff;--ok:#12805c;--warn:#b25e09;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}.tabs button{font:inherit;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;margin-right:6px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.live{font-size:12.5px;color:var(--mute)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-right:6px}.dot.on{background:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:20px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
h2{font-size:16px;margin:0 0 2px}.q{color:var(--mute);font-size:13px;margin-bottom:12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:16px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px;border-top:0}
.big{font-size:24px;font-weight:650}.kpis{display:flex;flex-wrap:wrap;gap:12px}.kpi{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi small{color:var(--mute);display:block}
.cite{font:11px ui-monospace,Menlo,monospace;background:#eef2ff;color:#2b3fb5;border:0;border-radius:5px;padding:1px 5px;margin:0 2px;cursor:pointer}
.cite:hover{background:#dbe4ff}.pill{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.backed,.low{color:var(--ok);border-color:#b7e3d1}.partial,.medium{color:var(--warn);border-color:#f2d3a8}.unbacked,.high{color:var(--bad);border-color:#f3b8b2}
.mute{color:var(--mute)}.note{font-size:13px;color:var(--mute);margin-top:6px}
.sep{border:1px dashed var(--bad);border-radius:10px;padding:8px 12px;margin-top:10px;background:#fff8f7}
.spark{font:12px ui-monospace,monospace;letter-spacing:1px}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);padding:20px;overflow:auto;transform:translateX(105%);transition:.2s;z-index:10}
#drawer.open{transform:none}#drawer pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;background:#f6f5f1;padding:10px;border-radius:8px}
#drawer .x{float:right;border:0;background:none;font-size:20px;cursor:pointer}
.move{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.rank{font-size:20px;font-weight:700;color:var(--acc)}
.meta{font-size:13px;color:var(--mute)}
</style></head><body>
<header><div><h1>Account CRM</h1><div class="live" id="live">loading…</div></div><div class="tabs" id="tabs"></div></header>
<main id="main">Loading…</main>
<aside id="drawer"><button class="x" onclick="closeD()">×</button><div id="dbody"></div></aside>
<script>
let D=null,cur=0;
const E=(n)=>n==null?"–":"€"+Number(n).toLocaleString("en-GB");
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips=(c=[],max=8)=>{const u=[...new Set(c)];return u.slice(0,max).map(i=>`<button class="cite" data-id="${esc(i)}">${esc(i)}</button>`).join("")+(u.length>max?`<span class="mute"> +${u.length-max}</span>`:"")};
const num=(v,f=E)=>v&&typeof v==="object"?`${f(v.value)} ${chips(v.cites,4)}`:f(v);
const pill=(t,c)=>`<span class="pill ${c||t}">${esc(t)}</span>`;
function openD(id){const r=D.refs[id];const b=document.getElementById("dbody");
 b.innerHTML=r?`<div class="mute">${esc(r.type)} · account ${esc(r.account||"–")}</div><h3 style="margin-top:4px">${esc(r.id)}</h3><b>${esc(r.title)}</b><pre>${esc(r.body)}</pre>`:`<b>${esc(id)}</b><p class="mute">No source with this id exists in the data.</p>`;
 document.getElementById("drawer").classList.add("open")}
function closeD(){document.getElementById("drawer").classList.remove("open")}
document.addEventListener("click",e=>{const t=e.target.closest(".cite");if(t)openD(t.dataset.id)});

function q1(a){const q=a.q1,t=q.totals;
 const rows=q.lines.map(l=>`<tr><td><b>${esc(l.title)}</b><div class="meta">${esc(l.status)} · ${esc(l.why)}</div></td><td>${l.value?num(l.value):"<span class=mute>not sized</span>"}</td><td>${pill(l.backing)}</td><td>${chips(l.evidence,5)}</td></tr>`).join("");
 return `<div class="kpis">
 <div class="kpi"><small>Recurring revenue, signed and paid</small><span class="big">${E(t.recurring.value)}</span><div>${chips(t.recurring.cites,3)}</div></div>
 <div class="kpi"><small>Closed expansion</small><span class="big">${E(t.closedExpansion.value)}</span><div>${chips(t.closedExpansion.cites,3)}</div></div>
 <div class="kpi"><small>Open pipeline, backed</small><span class="big">${E(t.pipelineBacked.value)}</span><div>${chips(t.pipelineBacked.cites,3)}</div></div>
 <div class="kpi"><small>Renewal at stake (the recurring above)</small><span class="big">${E(t.renewalAtStake.value)}</span><div>${chips(t.renewalAtStake.cites,3)}</div></div></div>
 <h3>Every deal at a backed value</h3><table><tr><th>Deal</th><th>Worth</th><th>Backing</th><th>Evidence</th></tr>${rows}</table>
 <div class="sep"><b>Cannot be backed</b> — partial ${num(t.pipelinePartial)} · unbacked ${num(t.pipelineUnbacked)} · open offers ${num(t.offersOpen)}.
 <div class="note">Kept out of the backed totals until someone verifies them.</div></div>
 <h3>Claims, shown apart from what was verified</h3>
 <div class="sep"><b>${esc(q.story.note)}</b> “${esc(q.story.text)}”</div>
 ${q.claims.map(c=>`<div style="margin-top:8px"><b>${esc(c.said_by)}</b> claimed: “${esc(c.text)}” ${chips([c.claim])}<div class="meta">${c.record.map(r=>`${pill(r.status,r.status==="verified"?"low":"medium")} ${esc(r.text)} ${chips([r.id])}`).join("<br>")}</div></div>`).join("")}
 <h3>What the activity records actually show</h3>
 ${q.activity.map(x=>`<div><b>${esc(x.title)}</b>: ${x.activeCount} of ${x.total} regularly active${x.noDock?`, ${x.noDock} with no dock`:""}. <span class="meta">Months ${esc(x.months.join(", "))}. File ${chips([x.file])}</span>
 <table><tr><th>Entity</th><th>Series</th><th></th></tr>${x.entities.map(e=>`<tr><td>${esc(e.label)}</td><td class="spark">${e.series.join(" · ")}</td><td>${e.active?pill("active","low"):pill("inactive","high")} ${e.noDock?pill("no dock","medium"):""}</td></tr>`).join("")}</table>
 ${(x.quality||[]).map(z=>`<div class="note">Data quality: ${esc(z.text)}</div>`).join("")}</div>`).join("")}
 <h3>Dock usage, last ${q.usage.windowWeeks} weeks</h3><div>${num(q.usage.withFlights,x=>x)} of ${q.usage.docks} docks logged flights. <span class="note">${esc(q.usage.caveat)}</span></div>`}

function q2(a){const q=a.q2;
 const person=p=>`<tr><td><b>${esc(p.name)}</b> ${chips([p.id],1)}<div class="meta">${esc(p.role)} · ${pill(p.relationship, p.relationship==="guarded"?"high":p.relationship==="neutral"?"medium":"low")}${p.available?"":" · away"}</div></td>
 <td>${(p.tags||[]).map(t=>`${pill(t.tag,"medium")} ${chips(t.cites,3)}`).join("<br>")||"<span class=mute>no role evidence</span>"}</td>
 <td class="meta">${p.lastContact?`${esc(p.lastContact.date)} — ${esc(p.lastContact.note)} ${chips([p.lastContact.cite])}`:"no contact on file"}${p.signIns?`<br>Last sign-in ${esc(p.signIns.last??"never")} ${chips([p.signIns.cite])}`:""}</td></tr>`;
 return `<div class="note">${esc(q.note)}</div>
 ${q.perDeal.map(d=>`<h3>${esc(d.title)} · ${pill(d.stage,"medium")}</h3>${d.blocker?`<div class="meta">Blocker (${esc(d.blocker.status)}): ${esc(d.blocker.text)}</div>`:""}
 <table><tr><th>Person · where they stand</th><th>Role in this deal (decides / pays / uses / could block)</th><th>Last contact</th></tr>${d.people.map(person).join("")||"<tr><td colspan=3 class=mute>No named person on file for this deal.</td></tr>"}</table>`).join("")}
 <div class="sep"><b>Roles nobody has named</b><ul>${q.notOnFile.map(n=>`<li>${esc(n.text)} ${chips(n.cites,3)}</li>`).join("")}</ul></div>`}

function q3(a){const q=a.q3;
 const mv=m=>`<div class="move"><div class="rank">${m.rank}</div><div><b>${esc(m.title)}</b>
 <div class="meta">Moves: ${esc(m.deal_title)} (${esc(m.deal)}) · worth up to ${m.value?num(m.value):"unsized"} · <b>due ${esc(m.due)}</b></div>
 <div class="meta">Owner: ${esc(m.owner.flytbase)}${m.owner.customer?` with ${esc(m.owner.customer.name)} ${chips([m.owner.customer.id])}`:""} ${chips([m.owner.cite])}</div>
 <ul class="meta" style="margin:4px 0 0 16px;padding:0">${m.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul><div>${chips(m.cites,10)}</div></div></div>`;
 return `<div class="note">${esc(q.rule)}</div>${q.moves.map(mv).join("")}<h3>Then, in the queue</h3>${q.queue.map(mv).join("")||"<div class=mute>Nothing else queued.</div>"}`}

function q4(a){return `<table><tr><th></th><th>What</th><th>When it turns bad</th><th>Why we think so</th><th>Source</th></tr>${a.q4.risks.map(r=>`<tr><td>${pill(r.severity)}</td><td>${esc(r.what)}</td><td>${esc(r.when)}</td><td class="meta">${esc(r.why)}</td><td>${chips(r.cites,4)}</td></tr>`).join("")}</table>`}

function q5(a){return `<table><tr><th>What we do not know</th><th>Why it matters</th><th>Who could fill it</th><th>Source</th></tr>${a.q5.unknown.map(u=>`<tr><td>${esc(u.what)}</td><td class="meta">${esc(u.why)}</td><td>${u.ask?`${esc(u.ask.name)} ${chips([u.ask.id])}<div class="meta">${esc(u.ask.basis)}</div>`:"<span class=mute>nobody on file</span>"}</td><td>${chips(u.cites,4)}</td></tr>`).join("")}</table>`}

function render(){const a=D.accounts[cur];
 document.getElementById("tabs").innerHTML=D.accounts.map((x,i)=>`<button class="${i===cur?"on":""}" onclick="cur=${i};render()">${esc(x.id)} · ${esc(x.name)}</button>`).join("");
 const L=D.live,ago=L.lastPoll?Math.round((Date.now()-Date.parse(L.lastPoll))/1000)+"s ago":"not yet";
 document.getElementById("live").innerHTML=`<span class="dot ${L.tokenConfigured?"on":""}"></span>${L.tokenConfigured?`live · polled ${ago} · ${L.polls} polls · ${L.notesWritten} notes written back · last data change ${L.lastChange?new Date(L.lastChange).toLocaleTimeString():"none yet"}`:"snapshot mode (no token on this server)"}${L.busy?" · "+esc(L.busy):""} · as of ${esc(String(D.asOf).slice(0,10))}`;
 const card=(n,t,sub,body)=>`<section><h2>${n}. ${t}</h2><div class="q">${sub}</div>${body}</section>`;
 document.getElementById("main").innerHTML=
 card(1,"What is the book worth?","Each deal at a backed value; what cannot be backed is kept apart.",q1(a))+
 card(2,"Who holds the power?","Per deal: who decides, pays, uses and could block, and where each stands.",q2(a))+
 card(3,"What do you do first?","First three moves, ranked, with an owner and a date inside every deadline.",q3(a))+
 card(4,"What is about to go wrong?","Deadlines at risk, people going cold, stuck deals, and when each turns bad.",q4(a))+
 card(5,"What do you still not know?","The gaps the plan rests on, and who could fill each.",q5(a));}
async function load(){try{const r=await fetch("/api/crm");D=await r.json();render()}catch(e){document.getElementById("main").textContent="Could not load: "+e}}
load();setInterval(()=>{fetch("/api/crm").then(r=>r.json()).then(d=>{D=d;if(!document.getElementById("drawer").classList.contains("open"))render()})},30000);
</script></body></html>
